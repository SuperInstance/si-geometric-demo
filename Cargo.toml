[package]
name = "si-geometric-demo"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: geometric algebra multivectors in WASM — proving Cyberloop's Grassmannian tracking IS ga-core"
authors = ["SuperInstance"]
license = "MIT"
repository = "https://github.com/SuperInstance/si-geometric-demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
